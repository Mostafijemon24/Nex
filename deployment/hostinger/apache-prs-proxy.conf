# Reverse proxy for n8n.avonixai.com -> PRS 3.0
# Web UI: Docker web on 127.0.0.1:3060
# Health: Docker API on 127.0.0.1:8060 (not publicly routed except /health*)
# App API traffic goes same-origin via Next.js /api/* -> api:8000
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Port "443"
RequestHeader set X-Forwarded-Host "expr=%{HTTP:Host}"
RequestHeader set X-Real-IP "%{REMOTE_ADDR}e"
ProxyTimeout 300
ProxyPass /.well-known !
ProxyPassReverse /.well-known !
ProxyPass /health/ready http://127.0.0.1:8060/health/ready retry=0 timeout=30
ProxyPassReverse /health/ready http://127.0.0.1:8060/health/ready
ProxyPass /health http://127.0.0.1:8060/health retry=0 timeout=30
ProxyPassReverse /health http://127.0.0.1:8060/health
ProxyPass / http://127.0.0.1:3060/ retry=0 timeout=300
ProxyPassReverse / http://127.0.0.1:3060/
RewriteEngine On
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/(.*) ws://127.0.0.1:3060/$1 [P,L]
